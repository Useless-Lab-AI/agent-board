function getAudioContext() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSound(type) {
  if (!audioEnabled) return;
  try {
    const actx = getAudioContext();
    const now = actx.currentTime;
    if (type === 'click') {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1000, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start(now);
      osc.stop(now + 0.04);
    } else if (type === 'approve') {
      const osc1 = actx.createOscillator();
      const osc2 = actx.createOscillator();
      const gain = actx.createGain();
      osc1.frequency.setValueAtTime(587.33, now);
      osc2.frequency.setValueAtTime(880.00, now + 0.06);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(actx.destination);
      osc1.start(now);
      osc2.start(now + 0.06);
      osc1.stop(now + 0.06);
      osc2.stop(now + 0.32);
    } else if (type === 'alert') {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(783.99, now + 0.08);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    } else if (type === 'archive') {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.18);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }
  } catch (e) {}
}

function easeOutCubic(t) { return (--t) * t * t + 1; }
function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }
function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
  const r = Math.max(0, Math.min(radius, width / 2, height / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + width - r, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + r);
  ctx.lineTo(x + width, y + height - r);
  ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
  ctx.lineTo(x + r, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

function drawCleanShadowRect(ctx, x, y, width, height, radius, fill, stroke, shadowColor, blur, offsetY) {
  ctx.save();
  if (shadowColor) {
    ctx.shadowColor = shadowColor;
    ctx.shadowBlur = blur || 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = offsetY || 0;
  }
  roundRect(ctx, x, y, width, height, radius, fill, stroke);
  ctx.restore();
}

function truncateText(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let len = text.length;
  while (len > 0 && ctx.measureText(text.slice(0, len) + '…').width > maxWidth) {
    len--;
  }
  return text.slice(0, len) + '…';
}

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 2) {
  const isCJK = /[\u4e00-\u9fa5\u3040-\u30ff]/.test(text);
  const units = isCJK ? Array.from(text) : text.split(' ');
  let line = '';
  let lineCount = 0;

  for (let i = 0; i < units.length; i++) {
    const sep = isCJK ? '' : (line === '' ? '' : ' ');
    const testLine = line + sep + units[i];
    if (ctx.measureText(testLine).width > maxWidth && line !== '') {
      lineCount++;
      if (lineCount >= maxLines) {
        ctx.fillText(truncateText(ctx, line + sep + units.slice(i).join(isCJK ? '' : ' '), maxWidth), x, y);
        return y + lineHeight;
      }
      ctx.fillText(line, x, y);
      line = units[i];
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  if (line) {
    ctx.fillText(line, x, y);
    y += lineHeight;
  }
  return y;
}

  ctx.font = '500 12px "Segoe UI", sans-serif';
  ctx.fillStyle = '#606d64';
  ctx.fillText(S.filterSource, fx, tbY + 26);
  fx += ctx.measureText(S.filterSource).width + 8;

  ctx.font = '500 12px "Segoe UI", sans-serif';
  const srcW = Math.max(110, ctx.measureText(S.allSources).width + 24);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#d3ddd6';
  roundRect(ctx, fx, tbY + 10, srcW, 32, 8, true, true);
  ctx.fillStyle = '#1e2b24';
  ctx.textAlign = 'center';
  ctx.fillText(S.allSources, fx + srcW / 2, tbY + 26);

  fx += srcW + 16;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#606d64';
  ctx.fillText(S.filterStatus, fx, tbY + 26);
  fx += ctx.measureText(S.filterStatus).width + 8;

  const stW = Math.max(110, ctx.measureText(S.allStatuses).width + 24);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#d3ddd6';
  roundRect(ctx, fx, tbY + 10, stW, 32, 8, true, true);
  ctx.fillStyle = '#1e2b24';
  ctx.textAlign = 'center';
  ctx.fillText(S.allStatuses, fx + stW / 2, tbY + 26);

  // Right side: Session count + Refresh button
  const activeCount = state.card4StowProgress >= 1 ? 3 : 4;
  ctx.textAlign = 'right';
  ctx.font = '500 12px "Segoe UI", sans-serif';
  ctx.fillStyle = '#606d64';
  ctx.fillText(S.sessionsCount(activeCount), 1920 - pad - 102, tbY + 26);

  const refX = 1920 - pad - 88;
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#d3ddd6';
  roundRect(ctx, refX, tbY + 10, 78, 32, 8, true, true);
  ctx.fillStyle = '#1e2b24';
  ctx.font = '600 12px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(S.refreshBtn, refX + 39, tbY + 26);

  // ------------------------------------------
  // Board Heading & Quick New Session Buttons (src/App.tsx)
  // ------------------------------------------
  const bhY = 138;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = '700 16px "Segoe UI", sans-serif';
  ctx.fillStyle = '#1e2b24';
  ctx.fillText(S.boardHeading, pad, bhY + 15);

  // Right side of Board Heading: [+ Codex] [+ Claude] [+ Antigravity] + Subheading
  ctx.textAlign = 'right';
  ctx.font = '400 12px "Segoe UI", sans-serif';
  ctx.fillStyle = '#606d64';
  ctx.fillText(S.boardSubheading, 1920 - pad, bhY + 15);
  const subW = ctx.measureText(S.boardSubheading).width;

  const quickProviders = [
    { id: 'codex', label: '+ Codex', w: 92 },
    { id: 'claude', label: '+ Claude', w: 94 },
    { id: 'antigravity', label: '+ Antigravity', w: 122 }
  ];
  let qx = 1920 - pad - subW - 16;
  for (let i = quickProviders.length - 1; i >= 0; i--) {
    const qp = quickProviders[i];
    qx -= qp.w;
    if (qp.id === 'claude') {
      uiTargets.quickClaude = { x: qx + qp.w / 2, y: bhY + 15 };
    }
    const isHovered = (qp.id === 'claude' && t >= 3.2 && t <= 3.7);
    ctx.fillStyle = isHovered ? '#eef5f1' : '#ffffff';
    ctx.strokeStyle = isHovered ? '#25634f' : '#cedbd3';
    ctx.lineWidth = isHovered ? 1.5 : 1;
    roundRect(ctx, qx, bhY, qp.w, 30, 8, true, true);

    drawAgentProviderBadge(ctx, qp.id, qx + 10, bhY + 7, 16, false);
    ctx.textAlign = 'left';
    ctx.font = '600 12px "Segoe UI", sans-serif';
    ctx.fillStyle = isHovered ? '#25634f' : '#1e2b24';
    ctx.fillText(qp.label, qx + 30, bhY + 15);
    qx -= 8;
  }

  // ------------------------------------------
  // 4 Authentic Session Cards in Grid (src/SessionCard.tsx)
  // ------------------------------------------
  const cardW = 442;
  const cardH = 804;
  const gap = (totalW - cardW * 4) / 3;
  const startY = 178;

  // Pre-record Card 4 Stow button resting target so it stays stable even during/after stowing
  ctx.font = '500 11.5px "Segoe UI", sans-serif';
  const c4StowW = Math.max(64, ctx.measureText(S.btnStow).width + 24);
  const c4BaseX = pad + (cardW + gap) * 3;
  const c4BaseFootY = startY + cardH - 88 + 10 + 34 + 8;
  uiTargets.card4Stow = { x: c4BaseX + cardW - 16 - c4StowW / 2, y: c4BaseFootY + 13 };

  // Card 1: Codex
  drawAuthenticSessionCard(pad, startY, cardW, cardH, {
    provider: 'codex',
    providerName: 'Codex',
    nativeId: '0196fb2a',
    projectName: 'agent-board',
    title: S.c1Title,
    execution: state.card1Exec,
    attention: state.card1Att,
    cardIndex: 0
  }, t, 1.0, S);

  // Card 2: Claude (Running with Markdown Table + Typing Indicator)
  drawAuthenticSessionCard(pad + (cardW + gap), startY, cardW, cardH, {
    provider: 'claude',
    providerName: 'Claude',
    nativeId: '94a8c31e',
    projectName: 'agent-board',
    title: S.c2Title,
    execution: 'RUNNING',
    attention: 'UNREAD_OUTPUT',
    cardIndex: 1
  }, t, 1.0, S);

  // Card 3: Antigravity (Completed Unread -> Marked Read in Ch.4)
  drawAuthenticSessionCard(pad + (cardW + gap) * 2, startY, cardW, cardH, {
    provider: 'antigravity',
    providerName: 'Antigravity',
    nativeId: '7bc920df',
    projectName: 'agent-board',
    title: S.c3Title,
    execution: state.card3Exec,
    attention: state.card3Att,
    cardIndex: 2
  }, t, 1.0, S);

  // Card 4: Codex (Idle -> Stowed in Ch.4)
  let c4Y = startY;
  let c4Alpha = 1.0;
  if (state.card4StowProgress > 0) {
    c4Y += state.card4StowProgress * 48;
    c4Alpha = 1.0 - state.card4StowProgress;
  }
  if (c4Alpha > 0.01) {
    drawAuthenticSessionCard(pad + (cardW + gap) * 3, c4Y, cardW, cardH, {
      provider: 'codex',
      providerName: 'Codex',
      nativeId: '3e810a4c',
      projectName: 'agent-board',
      title: S.c4Title,
      execution: 'IDLE',
      attention: 'READ',
      cardIndex: 3
    }, t, c4Alpha, S);
  }

  ctx.restore();
}

// ==========================================
// 7. DRAW AUTHENTIC SESSION CARD (src/SessionCard.tsx)
// ==========================================
function drawAuthenticSessionCard(x, y, w, h, session, t, alpha, S) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  const isWaiting = session.execution === 'WAITING_APPROVAL';
  const isRunning = session.execution === 'RUNNING';

  // Card surface & border (amber pulse when WAITING_APPROVAL, subtle green tint when RUNNING)
  if (isWaiting) {
    const pulse = (Math.sin(t * 6) + 1) * 0.5;
    drawCleanShadowRect(ctx, x, y, w, h, 12, true, false, `rgba(217, 119, 6, ${0.14 + pulse * 0.14})`, 18, 4);
    ctx.fillStyle = '#fffdf9';
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 1.8;
  } else {
    drawCleanShadowRect(ctx, x, y, w, h, 12, true, false, 'rgba(20, 36, 27, 0.06)', 14, 4);
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = isRunning ? '#bfd6c9' : '#dde5e0';
    ctx.lineWidth = 1;
  }
  roundRect(ctx, x, y, w, h, 12, true, true);

  // ------------------------------------------
  // 1. Card Header: 33x33 AgentLogo + Title + Subtitle (Provider · nativeId + 📁 projectName) + Plain ↗
  // ------------------------------------------
  const padX = x + 16;
  drawAgentProviderBadge(ctx, session.provider, padX, y + 15, 33, true);

  ctx.font = '600 14px "Segoe UI", sans-serif';
  ctx.fillStyle = '#1e2b24';
  ctx.fillText(truncateText(ctx, session.title, w - 104), padX + 43, y + 29);

  // Subtitle: Provider · nativeId
  ctx.font = '400 12px "Segoe UI", sans-serif';
  ctx.fillStyle = '#606d64';
  const subStr = `${session.providerName} · ${session.nativeId}`;
  ctx.fillText(subStr, padX + 43, y + 47);

  // Project Badge: 📁 agent-board (.project-badge)
  const subW = ctx.measureText(subStr).width;
  const badgeX = padX + 43 + subW + 8;
  const projText = `📁 ${session.projectName}`;
  ctx.font = '500 11px "Segoe UI", sans-serif';
  const projW = ctx.measureText(projText).width + 14;
  ctx.fillStyle = '#edf3ef';
  ctx.strokeStyle = '#d5e2da';
  ctx.lineWidth = 1;
  roundRect(ctx, badgeX, y + 34, projW, 18, 5, true, true);
  ctx.fillStyle = '#2d4c3e';
  ctx.textBaseline = 'middle';
  ctx.fillText(projText, badgeX + 7, y + 43);

  // Plain ↗ expand icon (.card-expand-icon: background transparent, border none, color #849086)
  ctx.font = '400 15px "Segoe UI", sans-serif';
  ctx.fillStyle = '#849086';
  ctx.textAlign = 'center';
  ctx.fillText('↗', x + w - 24, y + 26);

  // ------------------------------------------
  // 2. Badges Row (.session-badges: plain dot+text on left, attention pill/text on right)
  // ------------------------------------------
  const badgeRowY = y + 68;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  let execColor = '#849086';
  let execLabel = S.stateIdle;
  if (session.execution === 'WAITING_APPROVAL') {
    execColor = '#b85c00';
    execLabel = S.stateWaitingApproval;
  } else if (session.execution === 'RUNNING') {
    execColor = '#0284c7';
    execLabel = S.stateRunning;
  } else if (session.execution === 'COMPLETED') {
    execColor = '#25634f';
    execLabel = S.stateCompleted;
  }

  // Status dot (7x7)
  ctx.fillStyle = execColor;
  ctx.beginPath();
  ctx.arc(padX + 4, badgeRowY, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = '600 12px "Segoe UI", sans-serif';
  ctx.fillStyle = execColor;
  ctx.fillText(execLabel, padX + 13, badgeRowY);

  // Right-aligned Attention Badge
  const isUnread = session.attention === 'UNREAD_OUTPUT' || session.attention === 'UNREAD_COMPLETION';
  const attLabel = session.attention === 'UNREAD_OUTPUT'
    ? S.attUnreadOutput
    : (session.attention === 'UNREAD_COMPLETION' ? S.attUnreadCompletion : S.attRead);

  if (isUnread) {
    ctx.font = '600 11px "Segoe UI", sans-serif';
    const aw = ctx.measureText(attLabel).width + 16;
    ctx.fillStyle = '#e5f2eb';
    roundRect(ctx, x + w - 16 - aw, badgeRowY - 10, aw, 20, 999, true, false);
    ctx.fillStyle = '#226649';
    ctx.textAlign = 'center';
    ctx.fillText(attLabel, x + w - 16 - aw / 2, badgeRowY);
  } else {
    ctx.font = '500 11px "Segoe UI", sans-serif';
    ctx.fillStyle = '#909a92';
    ctx.textAlign = 'right';
    ctx.fillText(attLabel, x + w - 16, badgeRowY);
  }

  // ------------------------------------------
  // 3. Card Body: Authentic Structured Event Stream (.session-events)
  // ------------------------------------------
  const bodyY = y + 86;
  const bodyH = h - 180;
  const innerW = w - 32;

  ctx.save();
  ctx.beginPath();
  ctx.rect(padX, bodyY, innerW, bodyH);
  ctx.clip();

  let curY = bodyY + 4;

  if (session.cardIndex === 0) {
    // Card 1: User bubble -> Collapsible Tool Call -> Collapsible Tool Result -> AI Markdown + Code Block
    curY = drawUserEventBubble(ctx, padX, curY, innerW, S.roleUser, '14:20', S.copyFull, S.c1User);
    curY = drawToolCallBlock(ctx, padX, curY, innerW, '📄', S.toolCallBadge, S.c1ToolCall, '14:21');
    curY = drawToolResultBlock(ctx, padX, curY, innerW, S.toolResultBadge, S.c1ToolResult, 'exit 0', '0.4s');
    curY = drawAiMarkdownCodeEvent(ctx, padX, curY, innerW, S, {
      time: '14:21',
      heading: S.c1AiHeading,
      bullet: S.c1AiBullet,
      lang: 'typescript',
      codeLines: [
        'export async function verifyToken(token: string) {',
        '  return jwt.verify(token, pubKey, {',
        "    algorithms: ['RS256']",
        '  });',
        '}'
      ]
    });
    if (session.execution === 'RUNNING') {
      drawTypingIndicator(ctx, padX, curY + 4, innerW, S.typingIndicator('Codex'), t);
    }
  } else if (session.cardIndex === 1) {
    // Card 2: User bubble -> Tool Call -> Tool Result -> AI Markdown Table -> Live Typing Indicator
    curY = drawUserEventBubble(ctx, padX, curY, innerW, S.roleUser, '14:22', S.copyFull, S.c2User);
    curY = drawToolCallBlock(ctx, padX, curY, innerW, '>_', S.toolCallBadge, S.c2ToolCall, '14:22');
    curY = drawToolResultBlock(ctx, padX, curY, innerW, S.toolResultBadge, S.c2ToolResult, 'exit 0', '1.2s');
    curY = drawAiMarkdownTableEvent(ctx, padX, curY, innerW, S, {
      time: '14:23',
      heading: S.c2AiHeading,
      headers: S.c2TableHeaders,
      rows: [
        ['idx_token', '14.8ms', '1.1ms (-92%)'],
        ['idx_sessions', '22.4ms', '1.6ms (-93%)']
      ]
    });
    drawTypingIndicator(ctx, padX, curY + 4, innerW, S.typingIndicator('Claude'), t);
  } else if (session.cardIndex === 2) {
    // Card 3: User bubble -> Tool Call -> Tool Result -> AI Markdown Summary
    curY = drawUserEventBubble(ctx, padX, curY, innerW, S.roleUser, '14:18', S.copyFull, S.c3User);
    curY = drawToolCallBlock(ctx, padX, curY, innerW, '📄', S.toolCallBadge, S.c3ToolCall, '14:19');
    curY = drawToolResultBlock(ctx, padX, curY, innerW, S.toolResultBadge, S.c3ToolResult, 'exit 0', '0.6s');
    curY = drawAiMarkdownBulletsEvent(ctx, padX, curY, innerW, S, {
      time: '14:19',
      heading: S.c3AiHeading,
      bullets: [S.c3AiBullet1, S.c3AiBullet2],
      codeSnippet: 'export interface SessionItem { id: string; executionState: ExecutionState; }'
    });
  } else {
    // Card 4: User bubble -> Tool Call -> Tool Result -> AI Markdown Summary
    curY = drawUserEventBubble(ctx, padX, curY, innerW, S.roleUser, '13:55', S.copyFull, S.c4User);
    curY = drawToolCallBlock(ctx, padX, curY, innerW, '>_', S.toolCallBadge, S.c4ToolCall, '13:56');
    curY = drawToolResultBlock(ctx, padX, curY, innerW, S.toolResultBadge, S.c4ToolResult, 'exit 0', '0.9s');
    curY = drawAiMarkdownBulletsEvent(ctx, padX, curY, innerW, S, {
      time: '13:56',
      heading: S.c4AiHeading,
      bullets: [S.c4AiBullet1, S.c4AiBullet2],
      codeSnippet: "socket.on('close', () => socket.removeAllListeners('message'));"
    });
  }

  ctx.restore();

  // ------------------------------------------
  // 4. Bottom Controls (.card-bottom-controls: Full-width Interact button + Footer)
  // ------------------------------------------
  const ctrlY = y + h - 88;
  ctx.strokeStyle = '#edf1ee';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padX, ctrlY);
  ctx.lineTo(x + w - 16, ctrlY);
  ctx.stroke();

  // Full-width Interact button (.btn-interact-primary)
  const btnY = ctrlY + 10;
  const btnH = 34;
  if (session.cardIndex === 0) {
    uiTargets.card1Interact = { x: padX + innerW / 2, y: btnY + btnH / 2 };
  }
  const isInteractHover = (session.cardIndex === 0 && t >= 6.45 && t <= 6.85);
  if (isWaiting) {
    ctx.fillStyle = isInteractHover ? '#fde8bd' : '#fff5e0';
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = isInteractHover ? 2 : 1.5;
    roundRect(ctx, padX, btnY, innerW, btnH, 8, true, true);
    ctx.fillStyle = '#9a4d00';
    ctx.font = '700 13px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`⚡ ${S.btnInteract}`, padX + innerW / 2, btnY + btnH / 2);
  } else if (isRunning) {
    ctx.fillStyle = '#edf6f9';
    ctx.strokeStyle = '#bae6fd';
    ctx.lineWidth = 1;
    roundRect(ctx, padX, btnY, innerW, btnH, 8, true, true);
    ctx.fillStyle = '#0369a1';
    ctx.font = '600 13px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(S.btnInteract, padX + innerW / 2, btnY + btnH / 2);
  } else {
    ctx.fillStyle = '#e8f2ec';
    ctx.strokeStyle = '#cce0d4';
    ctx.lineWidth = 1;
    roundRect(ctx, padX, btnY, innerW, btnH, 8, true, true);
    ctx.fillStyle = '#1e523f';
    ctx.font = '600 13px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(S.btnInteract, padX + innerW / 2, btnY + btnH / 2);
  }

  // Footer Row (.card-footer: left [✓ 标记已读], right [收纳])
  const footY = btnY + btnH + 8;
  const footBtnH = 26;

  // Left: Mark Read
  ctx.font = '500 11.5px "Segoe UI", sans-serif';
  const mrW = Math.max(88, ctx.measureText(S.btnMarkRead).width + 20);
  if (session.cardIndex === 2) {
    uiTargets.card3MarkRead = { x: padX + mrW / 2, y: footY + footBtnH / 2 };
  }
  const mrHighlight = (session.cardIndex === 2 && t >= 10.65 && t <= 11.2);
  ctx.fillStyle = mrHighlight ? '#e5f2eb' : '#f4f7f5';
  ctx.strokeStyle = mrHighlight ? '#25634f' : '#e0e7e2';
  ctx.lineWidth = mrHighlight ? 1.5 : 1;
  roundRect(ctx, padX, footY, mrW, footBtnH, 6, true, true);
  ctx.fillStyle = (isUnread || mrHighlight) ? '#25634f' : '#909a92';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(S.btnMarkRead, padX + mrW / 2, footY + footBtnH / 2);

  // Right: Stow (收纳)
  const stowW = Math.max(64, ctx.measureText(S.btnStow).width + 24);
  const stowHighlight = (session.cardIndex === 3 && t >= 11.45 && t <= 12.1);
  ctx.fillStyle = stowHighlight ? '#e5f2eb' : '#f4f7f5';
  ctx.strokeStyle = stowHighlight ? '#25634f' : '#e0e7e2';
  ctx.lineWidth = stowHighlight ? 1.5 : 1;
  roundRect(ctx, x + w - 16 - stowW, footY, stowW, footBtnH, 6, true, true);
  ctx.fillStyle = stowHighlight ? '#25634f' : '#606d64';
  ctx.fillText(S.btnStow, x + w - 16 - stowW / 2, footY + footBtnH / 2);

  ctx.restore();
}

// ==========================================
// 8. AUTHENTIC EVENT STREAM COMPONENTS (src/SessionCard.tsx & ToolEventView.tsx)
// ==========================================
function drawUserEventBubble(ctx, x, y, w, roleLabel, timeStr, copyLabel, text) {
  ctx.save();
  // Meta row: 你  14:20   [复制全文]
  ctx.font = '600 11px "Segoe UI", sans-serif';
  ctx.fillStyle = '#606d64';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(roleLabel, x + 2, y + 8);
  const rw = ctx.measureText(roleLabel).width;

  ctx.font = '400 11px "Segoe UI", sans-serif';
  ctx.fillStyle = '#849086';
  ctx.fillText(timeStr, x + 2 + rw + 8, y + 8);

  // Copy button pill
  ctx.font = '500 10px "Segoe UI", sans-serif';
  const cw = ctx.measureText(copyLabel).width + 12;
  ctx.fillStyle = '#f4f7f5';
  ctx.strokeStyle = '#dde5e0';
  roundRect(ctx, x + w - cw, y, cw, 16, 4, true, true);
  ctx.fillStyle = '#606d64';
  ctx.textAlign = 'center';
  ctx.fillText(copyLabel, x + w - cw / 2, y + 8);

  // User gray bubble (#f0f4f1, border #dce5df)
  const bubbleY = y + 20;
  const bubbleH = 48;
  ctx.fillStyle = '#f0f4f1';
  ctx.strokeStyle = '#dce5df';
  ctx.lineWidth = 1;
  roundRect(ctx, x, bubbleY, w, bubbleH, 10, true, true);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '400 12px "Segoe UI", sans-serif';
  ctx.fillStyle = '#1e2b24';
  drawWrappedText(ctx, text, x + 12, bubbleY + 19, w - 24, 17, 2);

  ctx.restore();
  return bubbleY + bubbleH + 10;
}

function drawToolCallBlock(ctx, x, y, w, iconStr, badgeLabel, summaryText, timeStr) {
  ctx.save();
  const h = 32;
  ctx.fillStyle = '#f7faf8';
  ctx.strokeStyle = '#dce4e0';
  ctx.lineWidth = 1;
  roundRect(ctx, x, y, w, h, 8, true, true);

  // Badge: [>_ 工具调用] or [📄 工具调用]
  ctx.font = '600 11px "Segoe UI", sans-serif';
  const badgeStr = `${iconStr} ${badgeLabel}`;
  const bw = ctx.measureText(badgeStr).width + 14;
  ctx.fillStyle = '#e3ece6';
  roundRect(ctx, x + 8, y + 6, bw, 20, 5, true, false);
  ctx.fillStyle = '#285943';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(badgeStr, x + 8 + bw / 2, y + 16);

  // Summary text
  ctx.textAlign = 'left';
  ctx.font = '500 11.5px Consolas, "JetBrains Mono", monospace';
  ctx.fillStyle = '#2c3d34';
  ctx.fillText(truncateText(ctx, summaryText, w - bw - 68), x + 16 + bw, y + 16);

  // Right time + chevron ▸
  ctx.textAlign = 'right';
  ctx.font = '400 10.5px "Segoe UI", sans-serif';
  ctx.fillStyle = '#849086';
  ctx.fillText(`${timeStr}  ▸`, x + w - 10, y + 16);

  ctx.restore();
  return y + h + 8;
}

function drawToolResultBlock(ctx, x, y, w, badgeLabel, summaryText, exitPill, durPill) {
  ctx.save();
  const h = 32;
  ctx.fillStyle = '#f7faf8';
  ctx.strokeStyle = '#dce4e0';
  ctx.lineWidth = 1;
  roundRect(ctx, x, y, w, h, 8, true, true);

  // Badge: [✓ 工具结果]
  ctx.font = '600 11px "Segoe UI", sans-serif';
  const badgeStr = `✓ ${badgeLabel}`;
  const bw = ctx.measureText(badgeStr).width + 14;
  ctx.fillStyle = '#e5f2eb';
  roundRect(ctx, x + 8, y + 6, bw, 20, 5, true, false);
  ctx.fillStyle = '#236c4b';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(badgeStr, x + 8 + bw / 2, y + 16);

  // Summary
  ctx.textAlign = 'left';
  ctx.font = '400 11px "Segoe UI", sans-serif';
  ctx.fillStyle = '#52635a';
  ctx.fillText(truncateText(ctx, summaryText, w - bw - 106), x + 16 + bw, y + 16);

  // Right pills: [exit 0] [0.4s] ▸

function drawAiMarkdownCodeEvent(ctx, x, y, w, S, data) {
  ctx.save();
  let curY = drawAiMetaHeader(ctx, x, y, w, S, data.time);

  // Heading
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 13px "Segoe UI", sans-serif';
  ctx.fillStyle = '#1e2b24';
  ctx.fillText(data.heading.replace('### ', ''), x + 2, curY + 12);
  curY += 22;

  // Bullet
  ctx.font = '400 12px "Segoe UI", sans-serif';
  ctx.fillStyle = '#2c3d34';
  ctx.fillText(truncateText(ctx, data.bullet, w - 8), x + 2, curY + 12);
  curY += 22;

  // Markdown Code Block (.md-code-block)
  const codeH = 26 + data.codeLines.length * 17 + 10;
  ctx.fillStyle = '#f5f8f6';
  ctx.strokeStyle = '#dce5df';
  ctx.lineWidth = 1;
  roundRect(ctx, x, curY, w, codeH, 8, true, true);

  // Code header bar (#ebf1ed)
  ctx.fillStyle = '#ebf1ed';
  roundRect(ctx, x + 1, curY + 1, w - 2, 24, 7, true, false);
  ctx.font = '600 10.5px Consolas, monospace';
  ctx.fillStyle = '#52635a';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(data.lang, x + 10, curY + 13);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#25634f';
  ctx.fillText(S.copyCode, x + w - 10, curY + 13);

  // Code lines
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '400 11.5px Consolas, "JetBrains Mono", monospace';
  ctx.fillStyle = '#1e2b24';
  let lineY = curY + 42;
  for (const line of data.codeLines) {
    ctx.fillText(line, x + 10, lineY);
    lineY += 17;
  }

  ctx.restore();
  return curY + codeH + 8;
}

function drawAiMarkdownTableEvent(ctx, x, y, w, S, data) {
  ctx.save();
  let curY = drawAiMetaHeader(ctx, x, y, w, S, data.time);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 13px "Segoe UI", sans-serif';
  ctx.fillStyle = '#1e2b24';
  ctx.fillText(data.heading.replace('### ', ''), x + 2, curY + 12);
  curY += 20;

  // Markdown Table (.md-table-wrap)
  const rowH = 26;
  const tableH = rowH * (data.rows.length + 1);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#dce5df';
  ctx.lineWidth = 1;
  roundRect(ctx, x, curY, w, tableH, 7, true, true);

  // Header bg
  ctx.fillStyle = '#f0f5f2';
  roundRect(ctx, x + 1, curY + 1, w - 2, rowH, 6, true, false);

  const colW = w / 3;
  ctx.font = '600 11px "Segoe UI", sans-serif';
  ctx.fillStyle = '#2c3d34';
  ctx.textBaseline = 'middle';
  for (let c = 0; c < 3; c++) {
    ctx.fillText(data.headers[c], x + c * colW + 10, curY + rowH / 2);
  }

  // Rows
  ctx.font = '400 11px Consolas, "Segoe UI", monospace';
  for (let r = 0; r < data.rows.length; r++) {
    const ry = curY + (r + 1) * rowH;
    ctx.strokeStyle = '#e5ece8';
    ctx.beginPath();
    ctx.moveTo(x, ry);
    ctx.lineTo(x + w, ry);
    ctx.stroke();

    for (let c = 0; c < 3; c++) {
      ctx.fillStyle = c === 2 ? '#236c4b' : '#1e2b24';
      ctx.fillText(data.rows[r][c], x + c * colW + 10, ry + rowH / 2);
    }
  }

  ctx.restore();
  return curY + tableH + 8;
}

function drawAiMarkdownBulletsEvent(ctx, x, y, w, S, data) {
  ctx.save();
  let curY = drawAiMetaHeader(ctx, x, y, w, S, data.time);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 13px "Segoe UI", sans-serif';
  ctx.fillStyle = '#1e2b24';
  ctx.fillText(data.heading.replace('### ', ''), x + 2, curY + 12);
  curY += 22;

  ctx.font = '400 12px "Segoe UI", sans-serif';
  ctx.fillStyle = '#2c3d34';
  for (const b of data.bullets) {
    curY = drawWrappedText(ctx, b, x + 2, curY + 12, w - 6, 17, 2) - 4;
  }

  if (data.codeSnippet) {
    curY += 6;
    ctx.fillStyle = '#f5f8f6';
    ctx.strokeStyle = '#dce5df';
    roundRect(ctx, x, curY, w, 34, 7, true, true);
    ctx.font = '400 11px Consolas, monospace';
    ctx.fillStyle = '#236c4b';
    ctx.textBaseline = 'middle';
    ctx.fillText(truncateText(ctx, data.codeSnippet, w - 20), x + 10, curY + 17);
    curY += 40;
  }

  ctx.restore();
  return curY;
}

function drawTypingIndicator(ctx, x, y, w, label, t) {
  ctx.save();
  const h = 34;
  ctx.fillStyle = '#f2f7f4';
  ctx.strokeStyle = '#dbe6df';
  ctx.lineWidth = 1;
  roundRect(ctx, x, y, w, h, 8, true, true);

  ctx.font = '500 12px "Segoe UI", sans-serif';
  ctx.fillStyle = '#4e6157';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + 12, y + h / 2);

  // 3 Bouncing green dots (.session-typing-dots)
  const dotsX = x + 12 + ctx.measureText(label).width + 12;
  for (let i = 0; i < 3; i++) {
    const phase = (t * 5 - i * 0.45);
    const bounce = Math.sin(phase) > 0 ? Math.sin(phase) * 3 : 0;
    const alpha = 0.4 + (Math.sin(phase) + 1) * 0.3;
    ctx.fillStyle = `rgba(37, 99, 79, ${alpha})`;
    ctx.beginPath();
    ctx.arc(dotsX + i * 11, y + h / 2 - bounce, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ==========================================
// 11. MOUSE POINTER & CLICK ORCHESTRATION
// ==========================================
function drawBoardMouse(t) {
  if (t > 12.9) return;

  const waypoints = [
    { t: 0.0, x: 960, y: 520 },
    // Chapter 2: Hover & click [+ Claude] button in board header
    { t: 2.7, x: 960, y: 520 },
    { t: 3.3, x: uiTargets.quickClaude.x, y: uiTargets.quickClaude.y },
    { t: 3.5, x: uiTargets.quickClaude.x, y: uiTargets.quickClaude.y, click: true },
    { t: 3.68, x: uiTargets.quickClaude.x, y: uiTargets.quickClaude.y },
    // Inside NewSessionModal: click prompt text line, then click [Create & Start]
    { t: 4.0, x: uiTargets.newModalPrompt.x, y: uiTargets.newModalPrompt.y },
    { t: 4.1, x: uiTargets.newModalPrompt.x, y: uiTargets.newModalPrompt.y, click: true },
    { t: 5.3, x: uiTargets.newModalPrompt.x, y: uiTargets.newModalPrompt.y },
    { t: 5.75, x: uiTargets.newModalSubmit.x, y: uiTargets.newModalSubmit.y },
    { t: 5.9, x: uiTargets.newModalSubmit.x, y: uiTargets.newModalSubmit.y, click: true },
    { t: 6.1, x: uiTargets.newModalSubmit.x, y: uiTargets.newModalSubmit.y },
    // Chapter 3: Move to Card 1 [⚡ Interact] button, hover & click
    { t: 6.55, x: uiTargets.card1Interact.x, y: uiTargets.card1Interact.y },
    { t: 6.7, x: uiTargets.card1Interact.x, y: uiTargets.card1Interact.y, click: true },
    { t: 6.88, x: uiTargets.card1Interact.x, y: uiTargets.card1Interact.y },
    // Inside Expanded Session Modal: poise on [✓ Allow Once], click at 8.4s
    { t: 7.5, x: uiTargets.intAllow.x, y: uiTargets.intAllow.y },
    { t: 8.4, x: uiTargets.intAllow.x, y: uiTargets.intAllow.y, click: true },
    { t: 8.65, x: uiTargets.intAllow.x, y: uiTargets.intAllow.y },
    // Move to [Send] button in ChatComposer, click at 9.4s
    { t: 9.2, x: uiTargets.intSend.x, y: uiTargets.intSend.y },
    { t: 9.4, x: uiTargets.intSend.x, y: uiTargets.intSend.y, click: true },
    { t: 9.85, x: uiTargets.intSend.x, y: uiTargets.intSend.y },
    // Chapter 4: Click [✓ Mark Read] on Card 3, then [Stow] on Card 4
    { t: 10.7, x: uiTargets.card3MarkRead.x, y: uiTargets.card3MarkRead.y },
    { t: 10.9, x: uiTargets.card3MarkRead.x, y: uiTargets.card3MarkRead.y, click: true },
    { t: 11.15, x: uiTargets.card3MarkRead.x, y: uiTargets.card3MarkRead.y },
    { t: 11.55, x: uiTargets.card4Stow.x, y: uiTargets.card4Stow.y },
    { t: 11.7, x: uiTargets.card4Stow.x, y: uiTargets.card4Stow.y, click: true },
    { t: 12.15, x: uiTargets.card4Stow.x, y: uiTargets.card4Stow.y },
    { t: 12.8, x: 1350, y: 880 }
  ];

  let p0 = waypoints[0], p1 = waypoints[waypoints.length - 1];
  for (let i = 0; i < waypoints.length - 1; i++) {
    if (t >= waypoints[i].t && t <= waypoints[i + 1].t) {
      p0 = waypoints[i];
      p1 = waypoints[i + 1];
      break;
    }
  }

  const segDur = Math.max(0.001, p1.t - p0.t);
  const ratio = easeInOutQuad(clamp((t - p0.t) / segDur, 0, 1));
  const mx = p0.x + (p1.x - p0.x) * ratio;
  const my = p0.y + (p1.y - p0.y) * ratio;

  // Click ripple
  for (const wp of waypoints) {
    if (wp.click && t >= wp.t && t <= wp.t + 0.35) {
      const rp = (t - wp.t) / 0.35;
      ctx.save();
      ctx.strokeStyle = `rgba(37, 99, 79, ${1 - rp})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(wp.x, wp.y, 6 + rp * 26, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  ctx.save();
  ctx.translate(mx, my);
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = '#1e2b24';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 19);
  ctx.lineTo(4.8, 14.8);
  ctx.lineTo(8.8, 22.5);
  ctx.lineTo(11.8, 21);
  ctx.lineTo(7.8, 13.2);
  ctx.lineTo(13.8, 13.2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// ==========================================
// 13. TIMELINE TICK, EXPORT & UI LISTENERS
// ==========================================
let lastSoundCheck = -1;

function updateUIStrings() {
  const S = getStrings();
  document.title = S.pageTitle;
  uiBrandTitle.textContent = S.brandTitle;
  uiBrandBadge.textContent = S.brandBadge;
  const linkDesktop = document.getElementById('linkDesktopVideo');
  const linkMobile = document.getElementById('linkMobileVideo');
  const isZh = currentLocale === 'zh-CN' || currentLocale === 'zh';
  const isTw = currentLocale === 'zh-TW' || currentLocale === 'zh-tw';
  const isJa = currentLocale === 'ja-JP' || currentLocale === 'ja';
  if (linkDesktop) {
    linkDesktop.textContent = isZh ? '🖥️ 桌面看板演示' : isTw ? '🖥️ 桌面看板展示' : isJa ? '🖥️ デスクトップ版' : '🖥️ Desktop Board';
    linkDesktop.href = `index.html?lang=${currentLocale}`;
  }
  if (linkMobile) {
    linkMobile.textContent = isZh ? '📱 手机远程与语音' : isTw ? '📱 手機遠端與語音' : isJa ? '📱 モバイル＆音声' : '📱 Mobile & Voice';
    linkMobile.href = `mobile.html?lang=${currentLocale}`;
  }
  playBtn.textContent = isPlaying ? S.pause : S.play;
  restartBtn.textContent = S.restart;
  soundBtn.textContent = audioEnabled ? S.soundOn : S.soundOff;
  snapshotBtn.textContent = S.snapshot;
  exportBtn.textContent = S.exportVideo;
  renderStatus.textContent = S.statusReady(FPS, TOTAL_DURATION);

  chapterBar.innerHTML = '';
  S.chapters.forEach((ch) => {
    const pill = document.createElement('div');
    pill.className = 'chapter-pill';
    pill.dataset.time = ch.t;
    pill.innerHTML = `<span class="dot"></span><span>${ch.label}</span>`;
    pill.addEventListener('click', () => seekTo(ch.t));
    chapterBar.appendChild(pill);
  });
}

function updateChapterActive(t) {
  const S = getStrings();
  const pills = chapterBar.querySelectorAll('.chapter-pill');
  let activeIdx = 0;
  for (let i = 0; i < S.chapters.length; i++) {
    if (t >= S.chapters[i].t) activeIdx = i;
  }
  pills.forEach((p, idx) => {
    if (idx === activeIdx) p.classList.add('active');
    else p.classList.remove('active');
  });
}

function seekTo(t) {
  currentFrame = Math.round(t * FPS);
  renderFrame(t);
  updateChapterActive(t);
  const secStr = Math.floor(t).toString().padStart(2, '0');
  const msStr = Math.floor((t % 1) * 100).toString().padStart(2, '0');
  timeText.textContent = `00:${secStr}.${msStr} / 00:15.00`;
  timelineProgress.style.width = `${(t / TOTAL_DURATION) * 100}%`;
}

function tick(timestamp) {
  if (isPlaying) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    lastTimestamp = timestamp;
    currentFrame += playbackSpeed;
    if (currentFrame >= TOTAL_FRAMES) currentFrame = 0;
  } else {
    lastTimestamp = 0;
  }

  const t = currentFrame / FPS;
  renderFrame(t);
  updateChapterActive(t);

  const curSec10 = Math.floor(t * 10);
  if (curSec10 !== lastSoundCheck) {
    lastSoundCheck = curSec10;
    if (curSec10 === 14) playSound('alert');
    else if (curSec10 === 35) playSound('click');
    else if (curSec10 === 41) playSound('click');
    else if (curSec10 === 59) playSound('approve');
    else if (curSec10 === 67) playSound('click');
    else if (curSec10 === 84) playSound('approve');
    else if (curSec10 === 94) playSound('click');
    else if (curSec10 === 109) playSound('click');
    else if (curSec10 === 117) playSound('archive');
  }

  const progressPercent = (currentFrame / TOTAL_FRAMES) * 100;
  timelineProgress.style.width = `${progressPercent}%`;
  const secStr = Math.floor(t).toString().padStart(2, '0');
  const msStr = Math.floor((t % 1) * 100).toString().padStart(2, '0');
  timeText.textContent = `00:${secStr}.${msStr} / 00:15.00`;

  if (isPlaying) {
    animationId = requestAnimationFrame(tick);
  }
}

function takeSnapshot() {
  const t = currentFrame / FPS;
  const link = document.createElement('a');
  link.download = `agent-board-showcase-${currentLocale}-${t.toFixed(1)}s.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function exportVideo() {
  if (isRecording) return;
  const S = getStrings();
  isRecording = true;
  isPlaying = false;
  cancelAnimationFrame(animationId);
  exportBtn.disabled = true;
  exportBtn.textContent = S.exportingVideo;
  renderStatus.textContent = S.statusRecording;

  const stream = canvas.captureStream(FPS);
  let options = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12000000 };
  if (!MediaRecorder.isTypeSupported(options.mimeType)) {
    options = { mimeType: 'video/webm' };
  }

  const recorder = new MediaRecorder(stream, options);
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `agent-board-showcase-${currentLocale}.webm`;
    a.click();
    URL.revokeObjectURL(url);

    exportBtn.disabled = false;
    exportBtn.textContent = S.exportVideo;
    renderStatus.textContent = S.statusComplete;
    isRecording = false;
    isPlaying = true;
    currentFrame = 0;
    animationId = requestAnimationFrame(tick);
  };

  recorder.start();
  for (let f = 0; f < TOTAL_FRAMES; f++) {
    currentFrame = f;
    renderFrame(f / FPS);
    const pct = Math.floor((f / TOTAL_FRAMES) * 100);
    renderStatus.textContent = `STATUS: RENDERING ${pct}% [${f}/${TOTAL_FRAMES}]`;
    await new Promise(r => setTimeout(r, 1000 / FPS));
  }
  recorder.stop();
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const lang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLocale = lang;
    localStorage.setItem('agent_board_promo_lang', lang);
    updateUIStrings();
    renderFrame(currentFrame / FPS);
  });
});

document.querySelectorAll('.lang-btn').forEach(b => {
  if (b.dataset.lang === currentLocale) b.classList.add('active');
  else b.classList.remove('active');
});

playBtn.addEventListener('click', () => {
  const S = getStrings();
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? S.pause : S.play;
  if (isPlaying) {
    getAudioContext();
    lastTimestamp = performance.now();
    animationId = requestAnimationFrame(tick);
  }
});

restartBtn.addEventListener('click', () => {
  const S = getStrings();
  currentFrame = 0;
  isPlaying = true;
  playBtn.textContent = S.pause;
  getAudioContext();
  if (animationId) cancelAnimationFrame(animationId);
  lastTimestamp = performance.now();
  animationId = requestAnimationFrame(tick);
});

soundBtn.addEventListener('click', () => {
  const S = getStrings();
  audioEnabled = !audioEnabled;
  soundBtn.textContent = audioEnabled ? S.soundOn : S.soundOff;
  if (audioEnabled) getAudioContext();
});

speedBtn.addEventListener('click', () => {
  if (playbackSpeed === 1.0) playbackSpeed = 1.5;
  else if (playbackSpeed === 1.5) playbackSpeed = 2.0;
  else if (playbackSpeed === 2.0) playbackSpeed = 0.5;
  else playbackSpeed = 1.0;
  speedBtn.textContent = `${playbackSpeed.toFixed(1)}x`;
});

snapshotBtn.addEventListener('click', takeSnapshot);
exportBtn.addEventListener('click', exportVideo);

timeline.addEventListener('click', (e) => {
  const rect = timeline.getBoundingClientRect();
  const ratio = clamp((e.clientX - rect.left) / rect.width, 0, 1);
  seekTo(ratio * TOTAL_DURATION);
});

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  else if (e.code === 'KeyR') restartBtn.click();
  else if (e.code === 'KeyM') soundBtn.click();
  else if (e.code === 'KeyS') takeSnapshot();
  else if (e.code === 'Digit1') document.querySelector('.lang-btn[data-lang="en-US"]')?.click();
  else if (e.code === 'Digit2') document.querySelector('.lang-btn[data-lang="zh-CN"]')?.click();
  else if (e.code === 'Digit3') document.querySelector('.lang-btn[data-lang="zh-TW"]')?.click();
  else if (e.code === 'Digit4') document.querySelector('.lang-btn[data-lang="ja-JP"]')?.click();
  else if (e.code === 'ArrowLeft') seekTo(Math.max(0, (currentFrame / FPS) - 1.0));
  else if (e.code === 'ArrowRight') seekTo(Math.min(TOTAL_DURATION, (currentFrame / FPS) + 1.0));
});

updateUIStrings();

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('t')) {
  const seekT = parseFloat(urlParams.get('t'));
  isPlaying = false;
  playBtn.textContent = getStrings().play;
  seekTo(seekT);
} else {
  animationId = requestAnimationFrame(tick);
}
</script>
