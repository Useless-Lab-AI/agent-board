<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card 1: Codex Blue -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card 2: Claude Amber -->
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card 3: Antigravity Indigo/Purple -->
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Sparkle Gold -->
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#border)" stroke-width="4"/>

  <!-- Inner Board Grid: 4 Cards -->
  <!-- Top Left Card: Codex Live Terminal -->
  <g transform="translate(72, 72)">
    <rect width="168" height="152" rx="20" fill="url(#card-blue)" stroke="#334155" stroke-width="2"/>
    <!-- Terminal header -->
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="40" cy="24" r="5" fill="#eab308"/>
    <circle cx="56" cy="24" r="5" fill="#22c55e"/>
    <!-- Code prompt lines -->
    <rect x="20" y="52" width="70" height="8" rx="4" fill="#38bdf8"/>
    <rect x="20" y="72" width="128" height="6" rx="3" fill="#64748b"/>
    <rect x="20" y="90" width="104" height="6" rx="3" fill="#475569"/>
    <rect x="20" y="108" width="80" height="6" rx="3" fill="#334155"/>
    <!-- Live status pill -->
    <circle cx="144" cy="24" r="6" fill="#22c55e" filter="url(#glow)"/>
  </g>

  <!-- Top Right Card: Claude Session -->
  <g transform="translate(272, 72)">
    <rect width="168" height="152" rx="20" fill="url(#card-amber)" stroke="#334155" stroke-width="2"/>
    <!-- Claude tag -->
    <rect x="20" y="20" width="64" height="18" rx="6" fill="#d97706" fill-opacity="0.2"/>
    <rect x="20" y="20" width="64" height="18" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="32" cy="29" r="4" fill="#f59e0b"/>
    <rect x="42" y="26" width="34" height="6" rx="3" fill="#fbbf24"/>
    <!-- Content lines -->
    <rect x="20" y="56" width="120" height="6" rx="3" fill="#94a3b8"/>
    <rect x="20" y="74" width="128" height="6" rx="3" fill="#64748b"/>
    <rect x="20" y="92" width="90" height="6" rx="3" fill="#475569"/>
    <!-- Input prompt block -->
    <rect x="20" y="112" width="128" height="22" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
    <rect x="28" y="120" width="50" height="6" rx="3" fill="#fbbf24"/>
  </g>

  <!-- Bottom Left Card: Antigravity Session -->
  <g transform="translate(72, 256)">
    <rect width="168" height="184" rx="20" fill="url(#card-purple)" stroke="#334155" stroke-width="2"/>
    <!-- AG tag -->
    <rect x="20" y="20" width="76" height="18" rx="6" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="20" y="20" width="76" height="18" rx="6" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="32" cy="29" r="4" fill="#818cf8"/>
    <rect x="42" y="26" width="46" height="6" rx="3" fill="#a5b4fc"/>
    <!-- Execution status & output -->
    <rect x="20" y="56" width="128" height="6" rx="3" fill="#94a3b8"/>
    <rect x="20" y="74" width="112" height="6" rx="3" fill="#64748b"/>
    <rect x="20" y="92" width="124" height="6" rx="3" fill="#475569"/>
    <rect x="20" y="110" width="80" height="6" rx="3" fill="#334155"/>
    <!-- Tool call pill -->
    <rect x="20" y="132" width="128" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <rect x="32" y="146" width="70" height="6" rx="3" fill="#c7d2fe"/>
  </g>

  <!-- Bottom Right Card: Multi-Agent Hub -->
  <g transform="translate(272, 256)">
    <rect width="168" height="184" rx="20" fill="url(#card-blue)" stroke="#334155" stroke-width="2"/>
    <circle cx="356" cy="348" r="40" fill="#38bdf8" fill-opacity="0.1" filter="url(#glow)"/>
    <!-- Central Grid Hub Symbol -->
    <g transform="translate(44, 44)">
      <!-- Central Hub Star / Grid -->
      <path d="M 40 0 L 46 28 L 74 34 L 46 40 L 40 68 L 34 40 L 6 34 L 34 28 Z" fill="url(#sparkle)" filter="url(#glow)"/>
      <circle cx="40" cy="34" r="6" fill="#ffffff"/>
      <!-- Connecting nodes -->
      <circle cx="10" cy="10" r="5" fill="#38bdf8"/>
      <line x1="14" y1="14" x2="32" y2="28" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="70" cy="10" r="5" fill="#f59e0b"/>
      <line x1="66" y1="14" x2="48" y2="28" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="40" cy="80" r="5" fill="#a855f7"/>
      <line x1="40" y1="75" x2="40" y2="55" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3"/>
    </g>
    <!-- Label -->
    <rect x="28" y="146" width="112" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="42" y="151" width="84" height="6" rx="3" fill="#94a3b8"/>
  </g>
</svg>
